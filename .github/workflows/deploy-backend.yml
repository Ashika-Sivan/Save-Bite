name: EC2 Backend CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Server/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-to-ec2:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to your project folder on the EC2 instance
            # Note: Ensure you have already cloned your repository in the home directory
            cd ~/Save-Bite
            
            # 2. Pull the latest code from the main branch
            git pull origin main
            
            # 3. Rebuild the backend and redis containers, and restart them
            # We specify 'backend' and 'redis' so it doesn't build the frontend or prometheus unless needed
            sudo docker compose up -d --build backend redis
