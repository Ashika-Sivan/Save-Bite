services:

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - savebite-network

  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    image: savebite-server:latest
    container_name: savebite-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - savebite-network

  frontend:
    build:
      context: ./Client
      dockerfile: dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-/api}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_51U2yeI2Le4E4oyQiw4p4bCrRZozEROyeZyTcA0vsAlvpqt5gJH2GY7tKRYSHom6Fc1R9hPUfruWoYmQ3mdQGWXjU00XCI0ESxB}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-971184169971-umpca7fr81kfur1ghb8ihgrkempmt91l.apps.googleusercontent.com}
    image: savebite-client:latest
    container_name: savebite-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - savebite-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - savebite-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - savebite-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
    networks:
      - savebite-network

networks:
  savebite-network:
    driver: bridge













    