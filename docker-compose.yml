services:

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - savebite-network

  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    image: savebite-server:latest
    container_name: savebite-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - savebite-network

  frontend:
    build:
      context: ./Client
      dockerfile: dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-/api}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    image: savebite-client:latest
    container_name: savebite-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - savebite-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - savebite-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
    networks:
      - savebite-network

networks:
  savebite-network:
    driver: bridge













    