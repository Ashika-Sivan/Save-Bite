services:

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - savebite-network

  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    image: savebite-server:latest
    container_name: savebite-backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./.env
        required: false
      - path: ./Server/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - savebite-network

  frontend:
    build:
      context: ./Client
      dockerfile: dockerfile
      args:
        VITE_BASE_URL: /api
    image: savebite-client:latest
    container_name: savebite-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - savebite-network

networks:
  savebite-network:
    driver: bridge